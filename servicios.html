<style>
:root {
  --bg:#f5f7fb; --surf:#ffffff; --surf2:#eef1f8; --surf3:#e4e9f4;
  --blue:#1d4ed8; --blue-h:#1e40af; --blue-s:#2563eb; --blue-d:#1e3a8a;
  --teal:#0d9488; --teal-s:#0f766e; --green:#059669; --green-s:#16a34a;
  --emerald:#059669; --emerald-s:#16a34a;
  --violet:#7c3aed; --violet-s:#6d28d9; --amber:#d97706; --amber-s:#b45309;
  --txt:#0f172a; --txt-s:#374151; --txt-m:#6b7280;
  --bdr:rgba(0,0,0,0.08); --bdr-s:rgba(0,0,0,0.14);
  --glow:0 1px 2px rgba(0,0,0,0.04),0 4px 18px rgba(0,0,0,0.08);
  --glow-s:0 2px 8px rgba(0,0,0,0.07),0 12px 36px rgba(0,0,0,0.13);
  --sans:'Manrope',system-ui,sans-serif; --disp:'Sora',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes floatA{0%,100%{transform:translateY(0);}50%{transform:translateY(-24px);}}
@keyframes floatB{0%,100%{transform:translateY(0);}50%{transform:translateY(20px);}}
@keyframes gridPan{from{background-position:0 0;}to{background-position:52px 52px;}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(29,78,216,0.25);}50%{box-shadow:0 0 0 10px rgba(29,78,216,0);}}
.ha1{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .05s both;}
.ha2{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .18s both;}
.ha3{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .30s both;}
.rev{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);}
.rev.on{opacity:1;transform:translateY(0);}
.rev.d1{transition-delay:.07s;}.rev.d2{transition-delay:.14s;}.rev.d3{transition-delay:.21s;}.rev.d4{transition-delay:.28s;}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px;}
.sec{padding:clamp(72px,10vw,96px) 0;}
.sec-lg{padding:clamp(88px,12vw,120px) 0;}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(14px,2vw,22px);align-items:stretch;}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(14px,2vw,22px);align-items:stretch;}
.card{border-radius:16px;border:1px solid var(--bdr);background:#ffffff;padding:clamp(24px,3vw,34px);box-shadow:var(--glow);transition:border-color .3s,box-shadow .3s,transform .3s;display:flex;flex-direction:column;}
.card:hover{border-color:rgba(29,78,216,0.22);box-shadow:var(--glow-s);transform:translateY(-4px);}
.ew{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;border:1px solid rgba(29,78,216,0.16);background:rgba(29,78,216,0.06);padding:7px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--blue);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green-s);flex-shrink:0;animation:pulse 2.4s ease-in-out infinite;}
.sh{margin-bottom:clamp(36px,5.5vw,56px);}
.sh.c{text-align:center;max-width:44rem;margin-left:auto;margin-right:auto;}
.sh-t{margin-top:16px;font-family:var(--disp);font-size:clamp(1.75rem,3.8vw,2.7rem);font-weight:700;letter-spacing:-.02em;line-height:1.16;color:var(--txt);}
.sh-d{margin-top:14px;font-size:clamp(14.5px,2vw,18px);line-height:1.85;color:var(--txt-s);}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;padding:12px 24px;font-size:14.5px;font-weight:600;transition:all .2s;cursor:pointer;border:none;gap:6px;}
.btn-p{background:var(--blue);color:#fff;}.btn-p:hover{background:var(--blue-h);transform:translateY(-1px);}
.btn-s{background:transparent;border:1px solid rgba(0,0,0,0.16);color:var(--txt-s);}.btn-s:hover{border-color:rgba(29,78,216,0.4);color:var(--blue);}
.btn-teal{background:rgba(13,148,136,0.15);border:1px solid rgba(13,148,136,0.3);color:var(--teal-s);}.btn-teal:hover{background:rgba(13,148,136,0.22);border-color:rgba(13,148,136,0.5);color:#fff;}
.btn-sm{padding:9px 18px;font-size:13px;}
.tag{border-radius:9999px;border:1px solid rgba(0,0,0,0.09);background:rgba(0,0,0,0.04);padding:4px 11px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:var(--txt-s);}
.sb{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;}
.sb-dot{width:6px;height:6px;border-radius:50%;}
.sb.green{color:var(--green-s);}.sb.green .sb-dot{background:var(--green-s);}
.sb.blue{color:var(--blue-s);}.sb.blue .sb-dot{background:var(--blue-s);}
.sb.orange{color:#fb923c;}.sb.orange .sb-dot{background:#fb923c;}
.card-h{font-family:var(--disp);font-size:clamp(17px,2.4vw,22px);font-weight:600;color:var(--txt);margin-top:10px;}
.card-p{font-size:13.5px;line-height:1.8;color:var(--txt-s);margin-top:8px;flex-grow:1;}
.fl{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.fi{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.65;color:var(--txt-s);}
.fi svg{flex-shrink:0;margin-top:2px;color:var(--blue);}
.card-cta{margin-top:auto;padding-top:20px;}
.card-cta a{display:flex;width:100%;align-items:center;justify-content:center;border-radius:9999px;border:1px solid rgba(29,78,216,0.2);background:rgba(29,78,216,0.06);padding:10px 16px;font-size:13px;font-weight:600;color:var(--blue);transition:all .2s;}
.card-cta a:hover{border-color:rgba(29,78,216,0.4);background:rgba(29,78,216,0.12);color:var(--blue-h);}
@media(max-width:480px){.card-cta a{font-size:12.5px;padding:11px 12px;white-space:normal;}}
.apps-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:22px;}
.apps-strip-i{display:flex;align-items:center;gap:12px;border-radius:14px;border:1px solid var(--bdr);background:#ffffff;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,0.04);transition:border-color .25s,transform .25s;}
.apps-strip-i:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-2px);}
.apps-strip-i>span{font-size:22px;flex-shrink:0;}
.apps-strip-i b{font-size:13.5px;font-weight:600;color:var(--txt);}
.apps-strip-i p{font-size:11.5px;color:var(--txt-s);margin-top:2px;line-height:1.5;}
.apps-strip-i .tag2{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border-radius:9999px;padding:3px 9px;border:1px solid rgba(124,58,237,0.25);color:var(--blue);background:rgba(124,58,237,0.07);flex-shrink:0;}
@media(max-width:520px){.apps-strip-i{flex-wrap:wrap;padding:12px 14px;}.apps-strip-i .tag2{margin-left:0;}.apps-strip-i b{font-size:13px;}.apps-strip-i p{font-size:11px;}}
.hero-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(29,78,216,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(29,78,216,0.06) 1px,transparent 1px);background-size:52px 52px;animation:gridPan 14s linear infinite;mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%);}
.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(90px);}
.orb1{width:500px;height:500px;top:-80px;left:50%;transform:translateX(-50%);background:rgba(29,78,216,0.08);animation:floatA 10s ease-in-out infinite;}
.orb3{width:200px;height:200px;bottom:0;left:-30px;background:rgba(13,148,136,0.04);animation:floatA 14s ease-in-out infinite;}
.h1{font-family:var(--disp);font-size:clamp(2rem,5.6vw,4.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.12;color:var(--txt);}
.h1 em{font-style:normal;color:var(--blue);}
.wa-fab{position:fixed;bottom:80px;right:24px;z-index:199;width:54px;height:54px;border-radius:50%;background:#25D366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.4);transition:transform .2s,box-shadow .2s;}
.wa-fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(37,211,102,0.55);}
.wa-fab svg{fill:white;}
.sticky-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;transform:translateY(100%);transition:transform .4s cubic-bezier(.16,1,.3,1);pointer-events:none;}
.sticky-bar.show{transform:translateY(0);pointer-events:all;}
.sticky-inner{background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,0.09);padding:14px 24px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;}
.sticky-txt{font-size:14px;color:var(--txt-s);}.sticky-txt strong{color:var(--txt);}
.sticky-x{background:none;border:none;color:var(--txt-m);cursor:pointer;font-size:18px;padding:4px 8px;transition:color .2s;}.sticky-x:hover{color:var(--txt);}
.footer{border-top:1px solid rgba(255,255,255,0.06);background:#0f172a;padding:clamp(56px,9vw,80px) 0 32px;--txt:#e2e8f0;--txt-s:#94a3b8;--txt-m:#64748b;--bdr:rgba(255,255,255,0.08);--bdr-s:rgba(255,255,255,0.14);}
.fg3{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,40px);margin-bottom:32px;}
@media(max-width:768px){.fg3{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.fg3{grid-template-columns:1fr;}}
.fh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:#93c5fd;margin-bottom:15px;}
.flk{display:block;font-size:13.5px;color:#94a3b8;margin-bottom:9px;transition:color .2s;}.flk:hover{color:#f1f5f9;}
.fbot{border-top:1px solid rgba(255,255,255,0.07);padding-top:18px;font-size:12px;color:#64748b;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
hr{border:none;border-top:1px solid var(--bdr);}
</style>
</head>
