<style>
:root {
  --bg:#f5f7fb; --surf:#ffffff; --surf2:#eef1f8; --surf3:#e4e9f4;
  --blue:#1d4ed8; --blue-h:#1e40af; --blue-s:#2563eb; --blue-d:#1e3a8a;
  --teal:#0d9488; --teal-s:#0f766e; --green:#059669; --green-s:#16a34a;
  --emerald:#059669; --emerald-s:#16a34a;
  --violet:#7c3aed; --violet-s:#6d28d9; --amber:#d97706; --amber-s:#b45309;
  --txt:#0f172a; --txt-s:#374151; --txt-m:#6b7280;
  --bdr:rgba(0,0,0,0.08); --bdr-s:rgba(0,0,0,0.14);
  --glow:0 1px 2px rgba(0,0,0,0.04),0 4px 18px rgba(0,0,0,0.08);
  --glow-s:0 2px 8px rgba(0,0,0,0.07),0 12px 36px rgba(0,0,0,0.13);
  --sans:'Manrope',system-ui,sans-serif; --disp:'Sora',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
@keyframes floatA{0%,100%{transform:translateY(0);}50%{transform:translateY(-24px);}}
@keyframes floatB{0%,100%{transform:translateY(0);}50%{transform:translateY(20px);}}
@keyframes gridPan{from{background-position:0 0;}to{background-position:52px 52px;}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(5,150,105,0.3);}50%{box-shadow:0 0 0 12px rgba(5,150,105,0);}}
.ha1{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .05s both;}
.ha2{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .18s both;}
.ha3{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .30s both;}
.ha4{animation:fadeUp .65s cubic-bezier(.16,1,.3,1) .42s both;}
.rev{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);}
.rev.on{opacity:1;transform:translateY(0);}
.rev.d1{transition-delay:.07s;}.rev.d2{transition-delay:.14s;}.rev.d3{transition-delay:.21s;}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px;}
.sec{padding:clamp(72px,10vw,96px) 0;}
.sec-lg{padding:clamp(88px,12vw,120px) 0;}
.card{border-radius:20px;border:1px solid var(--bdr);background:linear-gradient(160deg,rgba(255,255,255,0.98),rgba(248,250,252,0.96));padding:clamp(20px,2.8vw,28px);box-shadow:var(--glow);backdrop-filter:blur(8px);transition:border-color .3s,box-shadow .3s;display:flex;flex-direction:column;}
.ew{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;border:1px solid var(--bdr);background:rgba(255,255,255,0.93);backdrop-filter:blur(12px);padding:7px 16px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.22em;color:var(--emerald-s);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--emerald-s);flex-shrink:0;animation:pulse 2.4s ease-in-out infinite;}
.sh{margin-bottom:clamp(36px,5.5vw,56px);}
.sh.c{text-align:center;max-width:44rem;margin-left:auto;margin-right:auto;}
.sh-t{margin-top:16px;font-family:var(--disp);font-size:clamp(1.75rem,3.8vw,2.7rem);font-weight:700;letter-spacing:-.02em;line-height:1.16;color:var(--txt);}
.sh-d{margin-top:14px;font-size:clamp(14.5px,2vw,18px);line-height:1.85;color:var(--txt-s);}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;padding:12px 24px;font-size:14.5px;font-weight:600;transition:all .2s;cursor:pointer;border:none;gap:6px;}
.btn-p{background:var(--blue);color:#fff;}.btn-p:hover{background:var(--blue-h);transform:translateY(-1px);}
.btn-teal{background:rgba(13,148,136,0.15);border:1px solid rgba(13,148,136,0.3);color:var(--teal-s);}.btn-teal:hover{background:rgba(13,148,136,0.22);border-color:rgba(13,148,136,0.5);color:#fff;}
.faq-item{border-bottom:1px solid var(--bdr);overflow:hidden;}
.faq-q{width:100%;background:none;border:none;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;text-align:left;color:var(--txt);font-family:var(--sans);font-size:15px;font-weight:600;transition:color .2s;}
.faq-q:hover{color:var(--emerald-s);}
.faq-arrow{flex-shrink:0;transition:transform .3s;color:var(--txt-m);}
.faq-arrow.open{transform:rotate(180deg);}
.faq-a{font-size:14px;line-height:1.9;color:var(--txt-s);padding-bottom:18px;max-width:680px;}
.fbox{border-radius:20px;border:1px solid var(--bdr);background:linear-gradient(160deg,rgba(255,255,255,1),rgba(248,250,252,0.98));padding:clamp(24px,4vw,40px);box-shadow:var(--glow);}
.fl2{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--txt-m);margin-bottom:7px;}
.fi2,.fs2,.ft2{width:100%;padding:12px 15px;border-radius:10px;border:1px solid rgba(0,0,0,0.1);background:#f5f7fb;color:var(--txt);font-family:var(--sans);font-size:14.5px;transition:border-color .2s,box-shadow .2s;outline:none;color-scheme:light;}
.fi2:focus,.fs2:focus,.ft2:focus{border-color:rgba(5,150,105,0.5);box-shadow:0 0 0 3px rgba(5,150,105,0.10);}
.fs2 option,.fs2 optgroup{background:#ffffff;color:#0f172a;}
.ft2{min-height:96px;resize:vertical;}
.fg2{margin-bottom:16px;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:540px){.fr2{grid-template-columns:1fr;}}
.fmsg{display:none;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;margin-bottom:16px;}
.fmsg.ok{display:block;background:rgba(5,150,105,0.13);border:1px solid rgba(52,211,153,0.27);color:var(--green-s);}
.fmsg.err{display:block;background:rgba(239,68,68,0.09);border:1px solid rgba(239,68,68,0.27);color:#fca5a5;}
.hero-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(29,78,216,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(29,78,216,0.06) 1px,transparent 1px);background-size:52px 52px;animation:gridPan 14s linear infinite;mask-image:radial-gradient(ellipse 80% 60% at 50% 50%,black 40%,transparent 100%);}
.orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(90px);}
.orb1{width:400px;height:400px;top:-60px;left:50%;transform:translateX(-50%);background:rgba(5,150,105,0.12);animation:floatA 10s ease-in-out infinite;}
.orb2{width:240px;height:240px;top:80px;right:-40px;background:rgba(26,86,219,0.07);animation:floatB 12s ease-in-out infinite;}
.h1{font-family:var(--disp);font-size:clamp(2rem,5.6vw,4.2rem);font-weight:600;letter-spacing:-.02em;line-height:1.12;color:var(--txt);}
.h1 em{font-style:normal;color:var(--emerald-s);}
.wa-fab{position:fixed;bottom:80px;right:24px;z-index:199;width:54px;height:54px;border-radius:50%;background:#25D366;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.4);transition:transform .2s;}
.wa-fab:hover{transform:scale(1.08);}
.wa-fab svg{fill:white;}
.footer{border-top:1px solid rgba(255,255,255,0.06);background:#0f172a;padding:clamp(56px,9vw,80px) 0 32px;--txt:#e2e8f0;--txt-s:#94a3b8;--txt-m:#64748b;--bdr:rgba(255,255,255,0.08);--bdr-s:rgba(255,255,255,0.14);}
.fg3{display:grid;grid-template-columns:1.4fr repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,40px);margin-bottom:32px;}
@media(max-width:768px){.fg3{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.fg3{grid-template-columns:1fr;}}
.fh{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;color:var(--emerald-s);margin-bottom:15px;}
.flk{display:block;font-size:13.5px;color:#94a3b8;margin-bottom:9px;transition:color .2s;}.flk:hover{color:#f1f5f9;}
.fbot{border-top:1px solid rgba(255,255,255,0.07);padding-top:18px;font-size:12px;color:#64748b;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr!important;}}
</style>
</head>
